services:
  postgres:
    image: postgres:17-alpine  
    environment:
      POSTGRES_DB: coffee
      POSTGRES_USER: coffee
      POSTGRES_PASSWORD: coffee
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffee -d coffee"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs:
    # Object storage for images/files (product photos, future uploads).
    # All-in-one `weed mini`; S3 endpoint on 8333, path-style URLs.
    # Credentials: anonymous Read (public product images) + admin/secret
    # (signed writes, dev-only) — see seaweedfs/s3.json.
    image: chrislusf/seaweedfs
    command: mini -dir=/data -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "8333:8333"
    volumes:
      - weed-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -w '%{http_code}\\n' http://localhost:8333/ | grep -qE '200|403|404'"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    working_dir: /app
    command: go run .
    environment:
      DATABASE_URL: postgres://coffee:coffee@postgres:5432/coffee?sslmode=disable
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_go_modules:/go/pkg/mod
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    working_dir: /app
    command: npm start -- --host 0.0.0.0
    ports:
      - "4200:4200"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
  weed-data:
  backend_go_modules:
  frontend_node_modules:
