version: '3'

tasks:
  default:
    desc: Start the frontend and backend
    cmds:
      - task --parallel backend frontend

  dev:
    desc: Start the frontend and backend
    cmds:
      - task --parallel backend frontend

  install:
    desc: Install frontend and backend dependencies
    cmds:
      - task --parallel install:backend install:frontend

  install:frontend:
    desc: Install frontend dependencies
    dir: frontend
    cmds:
      - npm install

  install:backend:
    desc: Download backend Go modules
    dir: backend
    cmds:
      - go mod download

  generate:
    desc: Generate Go database code from SQL queries and schema
    dir: backend
    cmds:
      - sqlc generate

  migrate:
    desc: Apply database migrations to the local Compose PostgreSQL database
    dir: backend
    cmds:
      - goose -dir db/migrations postgres "{{.DATABASE_URL | default `postgres://coffee:coffee@localhost:5432/coffee?sslmode=disable`}}" up

  rollback:
    desc: Roll back the most recently applied database migration
    dir: backend
    cmds:
      - goose -dir db/migrations postgres "{{.DATABASE_URL | default `postgres://coffee:coffee@localhost:5432/coffee?sslmode=disable`}}" down

  seed:
    desc: Apply database seed data and upload bundled assets to object storage
    deps: [migrate, objects:seed]
    dir: backend
    cmds:
      - goose -dir db/seeds -no-versioning postgres "{{.DATABASE_URL | default `postgres://coffee:coffee@localhost:5432/coffee?sslmode=disable`}}" up

  postgres:
    desc: Start PostgreSQL from Docker Compose
    cmds:
      - docker compose up postgres

  postgres:detached:
    desc: Start PostgreSQL from Docker Compose in the background
    cmds:
      - docker compose up --detach postgres

  seaweedfs:detached:
    desc: Start SeaweedFS (S3 object storage) from Docker Compose in the background
    cmds:
      - docker compose up --detach seaweedfs
      - docker compose ps seaweedfs

  objects:seed:
    desc: Upload bundled assets (product images) to the SeaweedFS bucket
    deps: [seaweedfs:detached]
    env:
      AWS_ACCESS_KEY_ID: admin
      AWS_SECRET_ACCESS_KEY: secret
    cmds:
      - aws s3 mb s3://my-bucket --endpoint-url "{{.S3_ENDPOINT | default `http://localhost:8333`}}" || true
      - aws s3 cp assets/products s3://my-bucket/products --recursive --exclude "ATTRIBUTION.md" --endpoint-url "{{.S3_ENDPOINT | default `http://localhost:8333`}}"

  frontend:
    desc: Start the Angular development server
    dir: frontend
    cmds:
      - npm start

  backend:
    desc: Start the Go API server
    dir: backend
    env:
      DATABASE_URL: '{{.DATABASE_URL | default `postgres://coffee:coffee@localhost:5432/coffee?sslmode=disable`}}'
    cmds:
      - go run .

  build:
    desc: Build the frontend and backend
    cmds:
      - task --parallel build:backend build:frontend

  verify:
    desc: Verify the backend and frontend (tests, build, codegen freshness)
    cmds:
      - task --parallel verify:backend verify:frontend

  verify:backend:
    desc: Verify the backend (tests and build)
    dir: backend
    cmds:
      - go test ./...
      - go build ./...

  verify:frontend:
    desc: Verify the frontend (tests, build, codegen freshness)
    dir: frontend
    cmds:
      - npm test
      - npm run build
      - npm run codegen:check

  build:frontend:
    dir: frontend
    cmds:
      - npm run build

  build:backend:
    dir: backend
    cmds:
      - go build ./...
